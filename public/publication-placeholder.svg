<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-labelledby="title desc">
  <title id="title">Publication figure placeholder</title>
  <desc id="desc">A placeholder schematic for a publication image.</desc>
  <rect width="640" height="480" fill="#ffffff"/>
  <rect x="34" y="34" width="572" height="412" rx="10" fill="#f8fafc" stroke="#d7dde5" stroke-width="2"/>
  <text x="320" y="76" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#34495e">Publication Figure</text>
  <text x="320" y="104" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#6b7280">Replace this SVG with the final paper image</text>
  <g fill="none" stroke="#2563eb" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M112 260c36-74 73-74 110 0s74 74 111 0 73-74 110 0 74 74 111 0"/>
    <path d="M112 290c36-54 73-54 110 0s74 54 111 0 73-54 110 0 74 54 111 0" opacity="0.55"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="13" fill="#475569">
    <rect x="92" y="148" width="124" height="58" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
