    <rect x="258" y="148" width="124" height="58" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="320" y="182" text-anchor="middle">Signal</text>
    <rect x="424" y="148" width="124" height="58" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="486" y="182" text-anchor="middle">Analysis</text>
  </g>
  <g stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)">
    <line x1="216" y1="177" x2="258" y2="177"/>
    <line x1="382" y1="177" x2="424" y2="177"/>
  </g>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#94a3b8"/>
