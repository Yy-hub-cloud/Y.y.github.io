name: Update publications

on:
  schedule:
    - cron: "0 2 1 1,7 *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-publications:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Update publication data
        run: npm run update-publications
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          OPENALEX_MAILTO: ${{ vars.OPENALEX_MAILTO }}
          PUBLICATION_OPENALEX_AUTHOR_ID: ${{ vars.PUBLICATION_OPENALEX_AUTHOR_ID }}
          PUBLICATION_AUTHOR_NAME: ${{ vars.PUBLICATION_AUTHOR_NAME }}
          PUBLICATION_AUTHOR_ALIASES: ${{ vars.PUBLICATION_AUTHOR_ALIASES }}
          PUBLICATION_AFFILIATIONS: ${{ vars.PUBLICATION_AFFILIATIONS }}
          PUBLICATION_TOPIC_KEYWORDS: ${{ vars.PUBLICATION_TOPIC_KEYWORDS }}
          PUBLICATION_ALLOW_NAME_ONLY: ${{ vars.PUBLICATION_ALLOW_NAME_ONLY }}
          PUBLICATION_SINCE_YEAR: ${{ vars.PUBLICATION_SINCE_YEAR }}
          PUBLICATION_MAX_RESULTS: ${{ vars.PUBLICATION_MAX_RESULTS }}

      - name: Check for publication changes
        id: publication-diff
        run: |
          if git diff --quiet -- app/publications-data.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Typecheck
        if: steps.publication-diff.outputs.changed == 'true'
        run: npm run typecheck

      - name: Build
        if: steps.publication-diff.outputs.changed == 'true'
        run: npm run build

      - name: Commit and push publication updates
        if: steps.publication-diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/publications-data.json
          git commit -m "Update publication data"
          git push
